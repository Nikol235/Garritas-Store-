server:
  port: 18080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: garritas-citas
              uri: lb://GARRITAS-CITAS-MS
              predicates:
                - Path=/api/v1/citas/**
            - id: garritas-saludo
              uri: lb://GARRITAS-CITAS-MS
              predicates:
                - Path=/saludo

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always